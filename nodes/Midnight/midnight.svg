<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="midnightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#ff6b6b"/>
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#midnightGrad)"/>
  
  <!-- Outer ring -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="url(#accentGrad)" stroke-width="1.5"/>
  
  <!-- Moon shape -->
  <path d="M32 12 C20 12 12 22 12 32 C12 42 20 52 32 52 C28 48 26 40 26 32 C26 24 28 16 32 12" 
        fill="url(#accentGrad)" opacity="0.9"/>
  
  <!-- Privacy shield/lock symbol -->
  <g transform="translate(30, 24)">
    <rect x="0" y="8" width="16" height="14" rx="2" fill="#ffffff" opacity="0.9"/>
    <path d="M8 4 C4 4 2 6 2 8 L2 10 L14 10 L14 8 C14 6 12 4 8 4" 
          fill="none" stroke="#ffffff" stroke-width="2" opacity="0.9"/>
    <circle cx="8" cy="15" r="2" fill="url(#midnightGrad)"/>
    <path d="M8 15 L8 19" stroke="url(#midnightGrad)" stroke-width="1.5"/>
  </g>
  
  <!-- ZK proof dots -->
  <circle cx="18" cy="32" r="2" fill="#ffffff" opacity="0.6"/>
  <circle cx="22" cy="38" r="1.5" fill="#ffffff" opacity="0.5"/>
  <circle cx="20" cy="26" r="1.5" fill="#ffffff" opacity="0.5"/>
</svg>
